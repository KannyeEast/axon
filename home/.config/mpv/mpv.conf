# Local files: decoded on the GPU, scaled well, opened at a sensible size on big screens.
# The interface is uosc (installed by Nix), which turns mpv's own controls off itself.
profile=high-quality
hwdec=auto-safe

# never larger than 60% of the screen, so it floats instead of covering everything
autofit-larger=60%x60%

# pick up where a file was left
save-position-on-quit=yes

screenshot-directory=~/Pictures/Screenshots
