"$schema" = 'https://starship.rs/config-schema.json'

# Colours are named, so they follow the terminal's palette.

command_timeout = 1000

format = """
$os$username$hostname$directory$git_branch$git_status$git_state$nix_shell
$character"""

right_format = "$cmd_duration"

# ── context line ────────
[os]
disabled = false
format = "[$symbol]($style) [∙](bright-black) "
style = "bold green"

[os.symbols]
NixOS = "󰊠"
Linux = "󰊠"

# Only appears as root or over SSH
[username]
format = "[$user]($style) "

[hostname]
ssh_only = false
format = "[$ssh_symbol$hostname]($style) "
style = "bold green"
ssh_symbol = "󰇧 "

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰉍 Downloads"
"Pictures" = "󰉏 Pictures"

# ── git ────────
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "bold yellow"
conflicted = "[~${count}](bold red) "
staged = "[+${count}](bold green) "
modified = "●${count} "
untracked = "?${count} "
deleted = "✘${count} "
renamed = "»${count} "
stashed = "≡${count} "
ahead = "[⇡${count}](bold blue) "
behind = "[⇣${count}](bold blue) "
diverged = "[⇡${ahead_count}⇣${behind_count}](bold blue) "

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold red"
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "pick"
bisect = "bisect"

# ── environment ────────
[nix_shell]
format = "[$symbol$state]($style) "
symbol = " "
style = "bold cyan"
impure_msg = "nix"
pure_msg = "nix pure"
unknown_msg = "nix"
heuristic = true

[cmd_duration]
format = "[$duration]($style)"
style = "bright-black"

# ── prompt line ────────
[character]
success_symbol = "[❯](bold yellow)[❯](bold purple)[❯](bold blue)"
error_symbol = "[❯](bold red)[❯](bold red)[❯](bold red)"

# ── transient profile ────────
[profiles]
transient = "$character"
rtransient = "$cmd_duration"