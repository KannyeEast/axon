# ── general ────────
set -g default-terminal "tmux-256color"
set -g mouse on
# closing the last session moves to another
set -g detach-on-destroy off
# image protocols survive inside tmux
set -g allow-passthrough on
set -ga terminal-features "*:RGB"
# apps inside see modified keys (Shift+Enter in Claude Code)
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
# the terminal's title is the session's name: the Stream Deck finds a project's window by it
set -g set-titles on
set -g set-titles-string "#S"

# ── prefix ────────
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# ── indexing ────────
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# ── status ────────
set -g status 2
set -g status-format[1] ""
set -g status-position top
set -g status-style "bg=default,fg=colour8"
set -g status-left ""
set -g status-right "#[fg=#{?client_prefix,colour3,colour6}]#S "
# continuum saves through status-right, and NixOS runs the plugins (/etc/tmux.conf) before this
# file, so the line above drops that hook: add it back (## because run-shell expands formats first)
run-shell 'dir=$(grep -o "/nix/store/[^ ]*/continuum/" /etc/tmux.conf) && tmux set -ga status-right "##(${dir}scripts/continuum_save.sh)"'

setw -g window-status-format "#[fg=colour8]#I #W"
setw -g window-status-current-format "#[fg=#{?client_prefix,colour3,colour4},underscore]#I #W"
setw -g window-status-separator " "

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"
set -g pane-border-indicators arrows
set -g message-style "bg=default,fg=colour6"
set -g mode-style "bg=colour8,fg=default"

# ── windows ────────
bind -N "previous window" -n M-H previous-window
bind -N "next window" -n M-L next-window
bind -N "new window in cwd" c new-window -c "#{pane_current_path}"

# ── panes ────────
bind -N "split vertically, keep cwd" '|' split-window -h -c "#{pane_current_path}"
bind -N "split horizontally, keep cwd" - split-window -v -c "#{pane_current_path}"

bind -N "select pane left" h select-pane -L
bind -N "select pane down" j select-pane -D
bind -N "select pane up" k select-pane -U
bind -N "select pane right" l select-pane -R

bind -N "resize left" -r H resize-pane -L 5
bind -N "resize down" -r J resize-pane -D 5
bind -N "resize up" -r K resize-pane -U 5
bind -N "resize right" -r L resize-pane -R 5

# ── git ────────
bind -N "lazygit over the window, in this pane's folder" g display-popup -E -w 90% -h 90% \
    -d "#{pane_current_path}" lazygit

# ── copy mode ────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── help ────────
bind -N "every binding" / display-popup -E -w 70% -h 75% \
    "tmux list-keys -N | less -R"

# ── misc ────────
# the way tmux starts: NixOS's file with the plugins, then this one (sensible's R skips the plugins)
bind -N "reload the config" R source-file /etc/tmux.conf \; source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind -N "toggle the status bar" b if -F "#{==:#{status},off}" "set status 2" "set status off"

# ── plugins (installed by Nix) ────────
set -g @continuum-restore 'on'
