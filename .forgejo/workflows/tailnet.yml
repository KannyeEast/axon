# The tailnet's policy (tailnet.hujson): checked on pull requests, applied after a merge into
# stable (.forgejo/tailnet.sh).
on:
  pull_request:
    paths: [tailnet.hujson]
  push:
    branches: [stable]
    paths: [tailnet.hujson]

jobs:
  policy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - run: nix shell nixpkgs#curl nixpkgs#jq --command bash .forgejo/tailnet.sh ${{ github.event_name == 'push' && 'apply' || 'validate' }}
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
