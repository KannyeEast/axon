# DV HDR10+ is ours, not TRaSH's: the Fire TV can't play it well until node1 transcodes
resource_providers:
  - name: local-sonarr
    type: custom-formats
    service: sonarr
    path: /home/gldn/axon/hosts/node1/home/.config/recyclarr/custom-formats/sonarr
  - name: local-radarr
    type: custom-formats
    service: radarr
    path: /home/gldn/axon/hosts/node1/home/.config/recyclarr/custom-formats/radarr
