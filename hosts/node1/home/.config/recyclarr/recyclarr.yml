# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# The profiles of Radarr and Sonarr, applied by recyclarr.service (downloads/profiles.nix).
# Based on TRaSH's German guide: German DL (German + the original language) > German > English,
# other languages never. "German" needs German for series; movies take English until a German
# release comes. Upgrades run until German DL; file sizes stay as set in the apps.

# ── sonarr ────────
sonarr:
  series:
    base_url: http://127.0.0.1:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    quality_profiles:
      - name: German
        score_set: german
        reset_unmatched_scores:
          enabled: true
        min_format_score: 10000
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 20000
        qualities:
          - name: 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
          - name: 720p
            qualities: [Bluray-720p, WEBDL-720p, WEBRip-720p, HDTV-720p]
      - name: Default
        score_set: german
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 20000
        qualities:
          - name: 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
          - name: 720p
            qualities: [Bluray-720p, WEBDL-720p, WEBRip-720p, HDTV-720p]

    custom_formats:
      - trash_ids:
          # language
          - 133589380b89f8f8394320901529bac1 # Not German or English
          # release groups and resolution
          - 9aa0ca0d2d66b6f6ee51fc630f46cf6f # German 1080p Booster
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
          - c99279ee27a154c2f20d1d505cc99e25 # 720p
          - 7940b2fb0278f27cf4f70187f2be95d6 # German Bluray Tier 01
          - 83b336a90d90d6b35ca673b007f80661 # German Bluray Tier 02
          - d8f8e1539827967e0e564833e6c08d33 # German Bluray Tier 03
          - 68be37323132b35cf333c81a2ac8fc16 # German Web Tier 01
          - f51b96a50b0e6196cb69724b7833d837 # German Web Tier 02
          - bda67c2c0aae257308a4723d92475b86 # German Web Tier 03
          - c2eec878fa1989599c226ce4c287d6a7 # German Scene
          - d6819cba26b1a6508138d25fb5e32293 # HD Bluray Tier 01
          - c2216b7b8aa545dc1ce8388c618f8d57 # HD Bluray Tier 02
          - e6258996055b9fbab7e9cb2f75819294 # WEB Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503 # WEB Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6 # WEB Tier 03
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack2
          - 44e7c4de10ae50265753082e5dc76047 # Repack3
          # unwanted
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - a6a6c33d057406aaad978a6902823c35 # German LQ
          - d80c9f7cd2aad50271f1bd4e53125778 # German LQ (release title)
          - 237eda4ef550a97da2c9d87b437e500b # German Microsized
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
          # ours
          - 3bc5f395426614e155e585a2f056cdf1 # Season Pack
          - 9b27ab6498ec0f31a3353992e19434ca # DV (w/o HDR fallback)
          - a7d3c2e94b5f4e8f9c1d6b0e2f4a8c31 # DV HDR10+ (custom-formats/sonarr)
        assign_scores_to:
          - name: German
          - name: Default
      # above any German-only release, which reaches about 13000 with its boosters and tiers, so
      # until_score 20000 means "until German DL"
      - trash_ids:
          - ed51973a811f51985f14e2f6f290e47a # German DL
          - c5dd0fd675f85487ad5bdf97159180bd # German DL (undefined)
        assign_scores_to:
          - name: German
            score: 20000
          - name: Default
            score: 20000
      # German is required in German and doesn't matter in Default
      - trash_ids:
          - 8a9fcdbb445f2add0505926df3bb7b8a # German
        assign_scores_to:
          - name: German
          - name: Default
            score: 0

# ── radarr ────────
radarr:
  movies:
    base_url: http://127.0.0.1:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    quality_profiles:
      - name: German
        score_set: german
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: 2160p
          until_score: 20000
        qualities:
          - name: 2160p
            qualities: [Bluray-2160p, WEBDL-2160p, WEBRip-2160p, HDTV-2160p]
          - name: 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
      - name: Default
