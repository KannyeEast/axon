    [general]
live_config_reload = true
working_directory = "None"

[terminal]
shell = { program = "zsh", args = ["-l", "-c", "tmux attach || tmux"] }

[window]
title = "Alacritty"
dynamic_title = true

decorations = "none"

opacity = 1

padding.x = 15
padding.y = 15

[window.dimensions]
columns = 160
lines = 80

[cursor.style]
shape= "Block"
blinking = "Never"

[colors]
#transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"

[font]
normal.family = "JetBrainsMonoNL Nerd Font Mono"
normal.style = "Regular"
size = 12.0

[font.bold]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Bold Italic"

# Everything between these markers is written by `flavours apply`.
# Start flavours
[colors.cursor]
cursor = "CellForeground"
text = "CellBackground"

[colors.selection]
text = "CellForeground"
background = "#323947"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.primary]
background = "#0c0c12"
foreground = "#a5b6cf"

[colors.normal]
black = "#1c1e27"
red = "#ff6b7a"
green = "#95d3af"
yellow = "#f1d8a5"
blue = "#8aa2ff"
magenta = "#c79bf0"
cyan = "#98d3ee"
white = "#a5b6cf"

[colors.bright]
black = "#323947"
red = "#ff6b7a"
green = "#95d3af"
yellow = "#f1d8a5"
blue = "#8aa2ff"
magenta = "#c79bf0"
cyan = "#98d3ee"
white = "#e6e8ee"
# End flavours
