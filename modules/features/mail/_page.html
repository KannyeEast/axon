<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
</head>
<body style="margin:0;padding:0;background:#F3F4F6;">
<div style="width:100%;box-sizing:border-box;padding:32px 12px;background:#F3F4F6;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
<div style="display:none;max-height:0;overflow:hidden;">@preview@</div>
<table role="presentation" width="600" style="width:600px;max-width:100%;margin:0 auto;border-collapse:separate;border-spacing:0;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;">
<tr><td style="height:4px;padding:0;background:@bar@;font-size:0;line-height:0;">&nbsp;</td></tr>
<tr>
<td style="padding:28px 32px 32px;">
<span style="display:inline-block;padding:3px 10px;border-radius:999px;background:@tint@;color:@color@;font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.06em;">@label@</span>
<h1 style="margin:14px 0 2px;font-size:24px;line-height:30px;font-weight:700;color:#111827;word-break:break-word;">@title@</h1>
<p style="margin:0;font-size:14px;line-height:20px;color:#6B7280;">@subtitle@</p>
@body@
</td>
</tr>
</table>
<p style="margin:18px 0 0;text-align:center;font-size:12px;line-height:18px;color:#4B5563;">@footer@</p>
</div>
</body>
</html>
