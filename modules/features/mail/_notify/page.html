<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
</head>
<body style="margin:0;padding:24px 12px;background:#ffffff;color:#1f2430;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;">
  <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="width:100%;max-width:1000px;margin:0 auto;border:1px solid #e6e8ee;border-radius:6px;border-collapse:separate;">
    <tr>
      <td style="padding:32px 28px 20px;text-align:center;">
        <span style="display:inline-block;padding:3px 12px;border-radius:999px;background:@tint@;color:@color@;font-size:12px;font-weight:600;">@label@</span>
        <h1 style="margin:14px 0 6px;font-size:24px;font-weight:400;line-height:1.35;color:#111318;word-break:break-word;">@title@</h1>
        <p style="margin:0;color:#6b7280;font-size:14px;">@subtitle@</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 28px;">@body@</td>
    </tr>
  </table>
  <p style="margin:14px 0 0;text-align:center;color:#9aa1ad;font-size:12px;">@footer@</p>
</body>
</html>
